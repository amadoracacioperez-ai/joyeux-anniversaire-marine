<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Aperçu</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Playfair+Display:ital,wght@1,700&display=swap">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(900px 480px at 50% 0%, #2d4174, transparent 70%), linear-gradient(#1b2745, #121a2f);
      color: #fff8ec;
      font-family: Nunito, sans-serif;
      text-align: center;
    }
    .cadeau { font-size: 150px; line-height: 1; }
    h1 { margin: 22px 0 12px; font: italic 700 78px "Playfair Display", Georgia, serif; color: #f2b134; }
    p { margin: 0; font-size: 36px; opacity: .9; }
    .cadenas { margin-top: 28px; font-size: 40px; letter-spacing: 14px; opacity: .85; }
  </style>
</head>
<body>
  <div>
    <div class="cadeau">🎁</div>
    <h1>Joyeux anniversaire, Marine !</h1>
    <p>Un petit jeu rien que pour toi…</p>
    <div class="cadenas">🔒🔒🔒🔒🔒🔒</div>
  </div>
</body>
</html>
