    <radialGradient id="soleil">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset=".6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffaf45"/>
    </radialGradient>
  </defs>

